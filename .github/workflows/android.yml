name: Android Build

on:
  push:
    branches: [main, 'system/**']
    tags: ['v*.*.*']
    paths:
      - 'software/android/**'
      - '.github/workflows/android.yml'
      - 'VERSION'
  pull_request:
    paths:
      - 'software/android/**'
      - '.github/workflows/android.yml'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project version policy
        working-directory: .
        run: python3 scripts/versioning.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            bash gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest "-PreleaseVersion=${GITHUB_REF_NAME#v}" --no-daemon --stacktrace
          else
            bash gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest --no-daemon --stacktrace
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 2pybot-apk
          path: software/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Name tagged APKs
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BUILD_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p tagged-apks
          cp app/build/outputs/apk/debug/app-debug.apk "tagged-apks/2PyBot-${BUILD_TAG}-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "tagged-apks/2PyBot-${BUILD_TAG}-release-unsigned.apk"
          (cd tagged-apks && sha256sum *.apk) > "tagged-apks/Android-SHA256SUMS-${BUILD_TAG}.txt"

      - name: Publish tagged Android APKs
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "2PyBot ${{ github.ref_name }}"
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: software/android/tagged-apks/*

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: 2pybot-apk-release-unsigned
          path: software/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
