name: One-pull deployment checks

on:
  push:
    branches: [main, 'hardware/**', 'bot/**']
    paths:
      - 'scripts/radxa/**'
      - 'software/radxa/console/console/**'
      - 'tests/test_one_pull.py'
      - 'tests/test_managed_git_pull.py'
      - 'tests/test_deployment_status.py'
      - 'tests/test_deployment_artifacts.py'
      - '.github/workflows/one-pull-ci.yml'
      - 'tests/test_radxa_deploy.py'
      - 'tests/test_firmware_updates.py'
  pull_request:
    paths:
      - 'scripts/radxa/**'
      - 'software/radxa/console/console/**'
      - 'tests/test_one_pull.py'
      - 'tests/test_managed_git_pull.py'
      - 'tests/test_deployment_status.py'
      - 'tests/test_deployment_artifacts.py'
      - '.github/workflows/one-pull-ci.yml'
      - 'tests/test_radxa_deploy.py'
      - 'tests/test_firmware_updates.py'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest==8.3.5 pyserial==3.5
      - name: Verify transactions, Git pull interface, maintenance locks and indicators
        run: python -m pytest tests/test_one_pull.py tests/test_managed_git_pull.py tests/test_deployment_status.py tests/test_deployment_artifacts.py tests/test_radxa_deploy.py tests/test_firmware_updates.py tests/test_bldc_integration.py -q
