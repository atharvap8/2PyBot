name: Radxa Deployment Checks

on:
  push:
    branches: [main, 'system/**']
    paths:
      - 'scripts/radxa/**'
      - 'tests/test_radxa_deploy.py'
      - '.github/workflows/radxa-deploy.yml'
  pull_request:
    paths:
      - 'scripts/radxa/**'
      - 'tests/test_radxa_deploy.py'
      - '.github/workflows/radxa-deploy.yml'

jobs:
  deployment-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check deployment behavior
        run: python -m unittest discover -s tests -p test_radxa_deploy.py -v
