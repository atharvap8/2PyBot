name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Firmware and Publish Tagged Outputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 board cores
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json \
            https://raw.githubusercontent.com/ricardoquesada/esp32-arduino-lib-builder/master/bluepad32_files/package_esp32_bluepad32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli core install esp32-bluepad32:esp32@4.1.0

      - name: Install BaseLink libraries
        run: |
          arduino-cli lib install "TMCStepper@0.7.3"
          arduino-cli lib install "STM32duino ISM6HG256X@2.1.0"
          arduino-cli lib install "QMC5883LCompass@1.2.3"
          arduino-cli lib install "NeoPixelBus by Makuna@2.8.4"

      - name: Build BaseLink
        run: |
          arduino-cli compile \
            --fqbn esp32-bluepad32:esp32:esp32:PartitionScheme=huge_app \
            --warnings default \
            --output-dir build/BaseLink \
            firmware/BaseLink/BaseLink.ino

      - name: Build legacy Controller
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --warnings default \
            --output-dir build/Controller \
            firmware/Controller/Controller.ino

      - name: Name outputs with the build tag
        env:
          BUILD_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          cp build/BaseLink/BaseLink.ino.bin "release/BaseLink-${BUILD_TAG}.bin"
          cp build/BaseLink/BaseLink.ino.bootloader.bin "release/BaseLink-${BUILD_TAG}.bootloader.bin"
          cp build/BaseLink/BaseLink.ino.partitions.bin "release/BaseLink-${BUILD_TAG}.partitions.bin"
          cp build/BaseLink/BaseLink.ino.elf "release/BaseLink-${BUILD_TAG}.elf"
          cp build/Controller/Controller.ino.bin "release/Controller-${BUILD_TAG}.bin"
          arduino-cli core list --format json > "release/core-versions-${BUILD_TAG}.json"
          arduino-cli lib list --format json > "release/library-versions-${BUILD_TAG}.json"

      - name: Record tag, commit, and checksums
        env:
          BUILD_TAG: ${{ github.ref_name }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          directory = Path('release')
          tag = os.environ['BUILD_TAG']
          manifest = {
              'tag': tag,
              'commit': os.environ['BUILD_COMMIT'],
              'baselink_fqbn': 'esp32-bluepad32:esp32:esp32:PartitionScheme=huge_app',
              'controller_fqbn': 'esp32:esp32:esp32',
          }
          (directory / f'build-info-{tag}.json').write_text(json.dumps(manifest, indent=2) + '\n')
          checksums = ''.join(
              f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n'
              for path in sorted(directory.iterdir())
              if path.is_file() and not path.name.startswith('SHA256SUMS-')
          )
          (directory / f'SHA256SUMS-{tag}.txt').write_text(checksums)
          PY

      - name: Upload tagged workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2PyBot-firmware-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "2PyBot ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release/*
          body: |
            ## 2PyBot ${{ github.ref_name }}

            Tagged source: `${{ github.sha }}`.

            BaseLink uses ESP32 LQR/LQI control, direct Bluepad32 gamepad input,
            TMC2226 drivers, runtime parameters, terrain adaptation, and camera payload controls.

            ### Firmware outputs

            | File | Purpose |
            | :--- | :--- |
            | `BaseLink-${{ github.ref_name }}.bin` | Robot application |
            | `BaseLink-${{ github.ref_name }}.bootloader.bin` | Robot bootloader, address 0x1000 |
            | `BaseLink-${{ github.ref_name }}.partitions.bin` | Huge APP partition table, address 0x8000 |
            | `BaseLink-${{ github.ref_name }}.elf` | Robot debug symbols |
            | `Controller-${{ github.ref_name }}.bin` | Retained legacy ESP-NOW transmitter |
            | `build-info-${{ github.ref_name }}.json` | Build tag, source commit, and board targets |
            | `core-versions-${{ github.ref_name }}.json` | Installed board-core versions |
            | `library-versions-${{ github.ref_name }}.json` | Installed library versions |
            | `SHA256SUMS-${{ github.ref_name }}.txt` | Checksums for release files |

            BaseLink's application address is 0x10000. The Controller binary is for the
            older ESP-NOW system; current BaseLink pairs its gamepad directly over Bluetooth.

            USB serial uses 460800 baud. START or serial `E` requests arming.
            Runtime parameter writes use `P,key,value`; `PS` saves to NVS.

            [Firmware setup](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/firmware/BaseLink/README.md)
            [Serial protocol](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/firmware/BaseLink/PROTOCOL.md)
