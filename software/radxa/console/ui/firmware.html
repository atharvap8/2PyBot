<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2PyBot firmware</title><link rel="stylesheet" href="/ui/style.css"></head>
<body><header><b>2PyBot · Controller firmware</b></header><main style="max-width:900px;margin:auto;padding:18px"><div class="card"><h3>Latest compiled build on this bot</h3><pre id="build"></pre><p>Reflashing restarts the ESP32. Keep the robot still during calibration. Local START is required afterwards.</p><button id="flash" disabled>Reflash latest compiled firmware</button><p id="reason"></p></div><div class="card"><h3>Update progress</h3><progress id="progress" value="0" max="100" style="width:100%"></progress><pre id="job"></pre><p id="error"></p></div></main>
<script>
let latest=null,requesting=false;const button=document.getElementById('flash');
async function refresh(){try{const response=await fetch('/api/firmware/status',{cache:'no-store'});if(!response.ok)throw Error(await response.text());const s=await response.json();latest=s.latest;document.getElementById('build').textContent=latest?`${latest.version}\n${latest.built_at}\nSHA-256 ${latest.sha256}\n${latest.size_bytes} bytes`:'No build registered';button.disabled=requesting || !s.can_flash;document.getElementById('reason').textContent=s.blocked_reason || 'Ready to reflash';document.getElementById('progress').value=s.job?.progress || 0;document.getElementById('job').textContent=s.job?`${s.job.status.toUpperCase()} · ${s.job.stage}\n${s.job.message}\n${s.job.error || ''}`:'No update requested';}catch(error){document.getElementById('error').textContent=String(error);button.disabled=true;}}
button.addEventListener('click',async()=>{if(!latest || requesting)return;requesting=true;button.disabled=true;try{const response=await fetch('/api/firmware/reflash',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({build_id:latest.build_id})});if(!response.ok)throw Error(await response.text());document.getElementById('error').textContent='';}catch(error){document.getElementById('error').textContent=String(error);}finally{requesting=false;refresh();}});refresh();setInterval(refresh,1000);
</script></body></html>
