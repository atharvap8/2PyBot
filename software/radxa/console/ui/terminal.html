<!doctype html><html lang=en><head>
<meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=theme-color content="#141210">
<title>2PyBot Terminal</title>
<link rel=stylesheet href=/ui/style.css?v=47>
<link rel=stylesheet href=/ui/vendor/xterm.css>
<style>
body{display:flex;flex-direction:column;height:100%}
.termwrap{flex:1;min-height:0;background:#141210;padding:8px 10px}
#term{height:100%}
.xterm .xterm-viewport{background:#141210!important}
</style></head><body class=shell>
<header class=top>
  <a class=brand href=/>
    <img class="brand-logo" src="/ui/logo.svg" alt="2PyBot">
    <div><span>terminal</span></div>
  </a>
  <div class=chips><span class=chip id=cstate>connecting…</span></div>
  <nav class=pages aria-label=Pages>
    <a href=/>Console</a><a href=/sysmap/>System</a><a href=/slam/>Maps</a>
    <a href=/deploy>Deploy</a><a class=sel href=/terminal>Terminal</a><a href=/ui/android.apk>App</a>
  </nav>
</header>
<div class=termwrap><div id=term></div></div>
<script src=/ui/vendor/xterm.js></script>
<script src=/ui/vendor/xterm-addon-fit.js></script>
<script>
const term = new Terminal({
  fontFamily: "ui-monospace,'DejaVu Sans Mono',Consolas,monospace", fontSize: 13, cursorBlink: true,
  theme: { background: "#141210", foreground: "#efe9e3", cursor: "#f08a4b",
           black: "#141210", brightBlack: "#73695f", red: "#ff4d6d", green: "#34d399", yellow: "#f0b84b",
           blue: "#60a5fa", magenta: "#a78bfa", cyan: "#38bdf8", white: "#efe9e3" } });
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById("term"));
fit.fit();
const chip = document.getElementById("cstate");
let ws;
function sendResize() { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ resize: [term.cols, term.rows] })); }
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/terminal/ws");
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { chip.textContent = "connected"; chip.className = "chip"; sendResize(); term.focus(); };
  ws.onmessage = (e) => term.write(typeof e.data === "string" ? e.data : new Uint8Array(e.data));
  ws.onclose = () => { chip.textContent = "disconnected — reconnecting"; chip.className = "chip warn"; setTimeout(connect, 1500); };
  ws.onerror = () => ws.close();
}
term.onData((d) => { if (ws && ws.readyState === 1) ws.send(new TextEncoder().encode(d)); });
addEventListener("resize", () => { fit.fit(); sendResize(); });
new ResizeObserver(() => { fit.fit(); sendResize(); }).observe(document.getElementById("term"));
connect();
</script></body></html>
