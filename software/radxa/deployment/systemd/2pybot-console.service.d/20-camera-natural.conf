[Service]
# Natural color at startup; camera may be unplugged while the console starts.
ExecStartPre=-/usr/bin/v4l2-ctl -d /dev/video0 --set-ctrl=auto_exposure=1,exposure_time_absolute=300,exposure_dynamic_framerate=0,white_balance_automatic=1,gamma=110,brightness=0,contrast=34,saturation=58,hue=0,gain=20,backlight_compensation=1,power_line_frequency=2
