pybot_joy_teleop:
  ros__parameters:
    # EvoFox One S in Bluetooth (X-Input) mode
    axis_linear: 1        # left stick Y
    axis_angular: 3       # right stick X
    button_enable: 0      # A
    button_kill: 1        # B
    deadzone: 0.08
    expo: 0.35
    max_linear: 0.5       # m/s
    max_angular: 2.0      # rad/s

joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.02        # raw driver deadzone; shaping done in teleop
    autorepeat_rate: 50.0
